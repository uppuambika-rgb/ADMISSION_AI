services:
  - type: web
    name: admissionai
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && npm --prefix frontend install && npm --prefix frontend run build
    startCommand: python backend/run.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: MONGODB_URL
        sync: false          # set manually in Render dashboard
      - key: MONGODB_DB
        value: admission_counselling
      - key: FRONTEND_URL
        sync: false          # set to the deployed frontend URL in Render
      - key: PYTHON_VERSION
        value: "3.11.9"
